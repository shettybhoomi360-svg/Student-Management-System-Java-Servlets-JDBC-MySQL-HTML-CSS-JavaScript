<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                🎓
                <div>
                    <strong>SMS</strong>
                    <small>Student Management System</small>
                </div>
            </div>

            <nav>

                <a href="dashboard.html" class="menu-item">
                    🏠 <span>Dashboard</span>
                </a>

                <a href="students.html" class="menu-item">
                    👥 <span>Students</span>
                </a>

                <a href="add-student.html" class="menu-item">
                    👤 <span>Add Student</span>
                </a>

                <a href="courses.html" class="menu-item">
                    📚 <span>Courses</span>
                </a>

                <a href="departments.html" class="menu-item">
                    🏛️ <span>Departments</span>
                </a>

                <a href="reports.html" class="menu-item">
                    📊 <span>Reports</span>
                </a>

                <a href="profile.html" class="menu-item active">
                    👨 <span>Profile</span>
                </a>

                <a href="index.html" class="menu-item logout">
                    🚪 <span>Logout</span>
                </a>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="dashboard-main">

            <header class="topbar">

                <div class="topbar-left">
                    <span class="hamburger">☰</span>
                    <h2>Profile</h2>
                </div>

                <div class="admin">
                    🔔
                    <span>👩🏻</span>
                    <strong>Admin</strong>
                    <span>⌄</span>
                </div>

            </header>


            <section class="dashboard-content">

                <h1>My Profile</h1>

                <p class="welcome-message">
                    View and manage your account information
                </p>

                <div class="profile-box">

                    <div class="profile-header">
                        <div class="profile-avatar">👩🏻</div>

                        <div>
                            <h2>Admin</h2>
                            <p>Administrator</p>
                        </div>
                    </div>

                    <div class="profile-details">

                        <div class="profile-item">
                            <label>Name</label>
                            <p>Admin</p>
                        </div>

                        <div class="profile-item">
                            <label>Role</label>
                            <p>Administrator</p>
                        </div>

                        <div class="profile-item">
                            <label>Email</label>
                            <p>admin@example.com</p>
                        </div>

                        <div class="profile-item">
                            <label>Status</label>
                            <p class="status-active">Active</p>
                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
